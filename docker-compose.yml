services:
  # Backend: Laravel (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ejpmx_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      - DB_CONNECTION=pgsql
      # ¡IMPORTANTE! El host ahora es el nombre del contenedor de la BD global
      - DB_HOST=global_postgres
      - DB_PORT=5432
      - DB_DATABASE=ejpmx_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=123
    command: sh -c "php artisan migrate --force && php-fpm"
    networks:
      - default
      - shared_db_network # Conecta el backend a la BD externa
    # Eliminamos el depends_on: - bd porque ese servicio ya no existe aquí

  # Servidor Web para Laravel: Nginx
  nginx:
    image: nginx:alpine
    container_name: ejpmx_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - default

  # Frontend: Vue.js (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ejpmx_frontend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - default

# Declaramos la red externa al final del archivo
networks:
  shared_db_network:
    external: true
