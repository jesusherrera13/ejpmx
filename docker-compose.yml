services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ejpmx_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=global_postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    command: sh -c "php artisan migrate --force && php-fpm"
    networks:
      - default
      - shared_db_network

  nginx:
    image: nginx:alpine
    container_name: ejpmx_nginx
    restart: unless-stopped
    ports:
      - "8000:80" 
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ejpmx_frontend
    restart: unless-stopped
    ports:
      - "80:80" # Frontend web principal
    networks:
      - default

networks:
  shared_db_network:
    external: true