# 1. Bloque HTTP: Redirige todo el tráfico no seguro (puerto 80) a HTTPS
server {
    listen 80;
    server_name eljuegoperfecto.com www.eljuegoperfecto.com;
    
    # Redirección 301 permanente hacia la versión segura
    return 301 https://$host$request_uri;
}

# 2. Bloque HTTPS: Maneja el tráfico seguro (puerto 443) y sirve como Proxy
server {
    listen 443 ssl;
    server_name eljuegoperfecto.com www.eljuegoperfecto.com;

    # Configuración de los certificados SSL (apunta a la carpeta creada por Certbot)
    ssl_certificate /etc/letsencrypt/live/eljuegoperfecto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eljuegoperfecto.com/privkey.pem;

    # Configuraciones generales mantenidas de tu archivo original
    client_max_body_size 20M;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # -------------------------------------------------------------------
    # A. Enrutamiento del FRONTEND
    # -------------------------------------------------------------------
    location / {
        # Todo el tráfico a la raíz se envía al contenedor "frontend" internamente en el puerto 80
        proxy_pass http://frontend:80; 
        
        # Encabezados para que el frontend sepa de dónde viene la petición real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------
    # B. Enrutamiento del BACKEND (Laravel)
    # -------------------------------------------------------------------
    # Asumimos que las llamadas de tu frontend a la API empiezan con /api
    location /api {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesamiento de los scripts PHP de Laravel usando FastCGI
    location ~ \.php$ {
        root /var/www/html/public;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Apunta al puerto 9000 del contenedor llamado "backend"
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}